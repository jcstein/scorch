name: Refresh Source Data

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh data files
        run: |
          mkdir -p public/data
          node scripts/refresh-data.mjs

      - name: Publish data branch
        run: |
          set -euo pipefail
          data_branch="cursor/jcs/source-data-595d"
          mkdir -p /tmp/scorch-data
          cp public/data/refresh.json public/data/link-health.json public/data/live-events.json /tmp/scorch-data/
          rm -rf public/data
          git reset --hard
          git fetch --depth=1 origin "$data_branch"
          git checkout -B "$data_branch" "origin/$data_branch"
          mkdir -p public/data
          cp /tmp/scorch-data/refresh.json /tmp/scorch-data/link-health.json /tmp/scorch-data/live-events.json public/data/
          git add public/data/refresh.json public/data/link-health.json public/data/live-events.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh source data"
          git push origin "HEAD:$data_branch"
