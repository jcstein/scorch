name: Refresh Source Data

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Seed previous data
        run: |
          set -euo pipefail
          mkdir -p public/data
          git fetch --depth=1 origin data
          git checkout origin/data -- public/data

      - name: Refresh data files
        run: node scripts/refresh-data.mjs

      - name: Publish data branch
        run: |
          set -euo pipefail
          data_branch="data"
          rm -rf /tmp/scorch-data
          mkdir -p /tmp/scorch-data
          cp -a public/data /tmp/scorch-data/data
          rm -rf public/data
          git reset --hard
          git fetch --depth=1 origin "$data_branch"
          git checkout -B "$data_branch" "origin/$data_branch"
          rm -rf public/data
          mkdir -p public/data
          cp -a /tmp/scorch-data/data/. public/data/
          git add -A public/data
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh source data"
          git push origin "HEAD:$data_branch"
